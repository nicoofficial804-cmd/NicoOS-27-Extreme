#
# pacman.conf usato durante la COSTRUZIONE della ISO NicoOS
# (profiledef.sh: pacman_conf).
#
# build.sh sostituisce /home/nicoo/NicoOS-27-EXTREME/.build/packages con il percorso assoluto del repository
# locale che contiene i pacchetti non presenti nei repository Arch
# (calamares, nicoos-shell) e scrive il risultato in archiso/pacman.conf.
#
# I server sono elencati esplicitamente invece di includere
# /etc/pacman.d/mirrorlist, cosi' la build della ISO non dipende dalla
# configurazione dei mirror della macchina che la costruisce.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# La build gira dentro un chroot; il controllo dello spazio libero non ci
# puo' funzionare.
#CheckSpace

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[nicoos]
SigLevel = Optional TrustAll
Server = file:///home/nicoo/NicoOS-27-EXTREME/.build/packages
