# /run/nicoos — canale tra una sessione grafica che non riesce ad avviare
# Hyprland (vedi nicoos-emergency-console.path) e il servizio di root che apre
# la Shell di emergenza su una VT di testo. Scrivibile da tutti perché ogni
# utente deve poter chiedere la console per sé; il servizio si fida solo del
# proprietario del file.
d /run/nicoos 1777 root root -
