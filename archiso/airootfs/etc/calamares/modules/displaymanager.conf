# /etc/calamares/modules/displaymanager.conf — NicoOS 27 Extreme
#
# SDDM è l'unico display manager supportato: avvia la wayland-session
# `nicoos`, cioè /usr/local/bin/nicoos-session, che porta su Hyprland e la
# shell NicoOS (o la Shell di emergenza se Hyprland muore).
---
displaymanagers:
    - sddm

# Il desktop preselezionato dal greeter: la wayland-session `nicoos`, cioè
# Hyprland avviato tramite /usr/local/bin/nicoos-session.
defaultDesktopEnvironment:
    executable: "nicoos-session"
    desktopFile: "nicoos"

basicSetup: false
sysconfigSetup: false

sddm:
    configuration_file: "/etc/sddm.conf"
