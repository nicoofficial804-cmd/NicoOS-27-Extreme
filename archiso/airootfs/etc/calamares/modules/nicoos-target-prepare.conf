# /etc/calamares/modules/nicoos-target-prepare.conf
#
# istanza shellprocess `target-prepare`: viene eseguita dentro il sistema di
# destinazione (dontChroot: false) subito dopo unpackfs e prima di
# users/initcpio.
---
dontChroot: false
timeout: 300
verbose: true
script:
    - command: "/usr/local/bin/nicoos-target-prepare"
      timeout: 300
