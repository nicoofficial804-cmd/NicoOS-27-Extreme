# /etc/calamares/modules/services-systemd.conf — NicoOS 27 Extreme
#
# Lo stesso insieme attivo nella ISO live; abilitarli anche qui rende il
# sistema installato indipendente da come è stato prodotto il root file
# system.
#
# `sddm` è l'unica voce che non deve fallire in silenzio: sddm.service non ha
# WantedBy=, solo Alias=display-manager.service, e graphical.target avvia il
# desktop tramite quell'alias. Senza di esso il sistema installato si avvia su
# una TTY semplice, quindi un'abilitazione fallita deve interrompere
# l'installazione.
#
# Il target predefinito (graphical.target) è impostato da nicoos-target-prepare;
# questo modulo non ha un'opzione per il target predefinito in Calamares 3.4.
---
units:
    - name: sddm
      action: enable
      mandatory: true
    - name: NetworkManager
      action: enable
    - name: bluetooth
      action: enable
    - name: power-profiles-daemon
      action: enable
    - name: fstrim.timer
      action: enable
