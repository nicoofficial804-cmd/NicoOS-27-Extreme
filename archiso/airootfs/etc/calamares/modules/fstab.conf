# /etc/calamares/modules/fstab.conf — NicoOS 27 Extreme
---
crypttabOptions: luks

# Come il sistema installato monta /tmp. Richiesto dallo schema fstab di
# Calamares.
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
# L'installer scrive il vero /etc/fstab del sistema installato; l'fstab della
# ISO live è vuoto perché la sua radice è lo squashfs di archiso.
