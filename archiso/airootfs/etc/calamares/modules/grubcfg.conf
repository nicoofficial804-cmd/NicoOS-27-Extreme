# /etc/calamares/modules/grubcfg.conf — NicoOS 27 Extreme
#
# Nome delle voci del menu GRUB e avvio silenzioso e personalizzato. Le
# chiavi seguono lo schema grubcfg di Calamares 3.4 (grubcfg.schema.yaml):
# snake_case, e `defaults` deve contenere sia GRUB_TIMEOUT sia GRUB_DEFAULT.
---
overwrite: true

# Mantieni GRUB_DISTRIBUTOR da /etc/default/grub, che nicoos-target-prepare
# imposta a "NicoOS".
keep_distributor: true

prefer_grub_d: false
always_use_defaults: false

# Il kernel installato non deve mai ereditare i parametri archiso della ISO
# live: il root file system sta sul disco, non su uno squashfs.
kernel_params: []
