# /etc/calamares/modules/partition.conf — NicoOS 27 Extreme
---
efi:
    mountPoint: /boot
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: NICOOSEFI

# Nessuna scelta di partizionamento automatico è preselezionata: l'utente
# deve scegliere esplicitamente "Cancella disco" / "Installa accanto" /
# "Manuale", così nulla viene mai cancellato per errore.
initialPartitioningChoice: none
initialSwapChoice: none
userSwapChoices:
    - none
    - small
    - swapfile
    - reuse

drawNestedPartitions: false
alwaysShowPartitionLabels: true

defaultFileSystemType: ext4
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - f2fs
