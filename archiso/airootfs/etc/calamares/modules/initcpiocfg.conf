# /etc/calamares/modules/initcpiocfg.conf — NicoOS 27 Extreme
#
# Gli hook di archiso stanno in /etc/mkinitcpio.conf.d/archiso.conf, che
# nicoos-target-prepare elimina. Resta il /etc/mkinitcpio.conf originale di
# Arch (base udev autodetect microcode modconf kms keyboard keymap consolefont
# block filesystems fsck), esattamente ciò che serve a un sistema installato.
# Il modulo aggiunge comunque `encrypt`/`lvm2` quando il layout scelto li
# richiede.
---
useSystemdHook: false

source: "/etc/mkinitcpio.conf"

hooks:
    prepend: []
    append: []
    remove: []
