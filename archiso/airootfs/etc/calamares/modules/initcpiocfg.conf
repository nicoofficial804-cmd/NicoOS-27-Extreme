# /etc/calamares/modules/initcpiocfg.conf — NicoOS 27 Extreme
#
# Gli hook di archiso stanno in /etc/mkinitcpio.conf.d/archiso.conf, che
# nicoos-target-prepare elimina.
#
# Il modulo non estende gli hook esistenti: li RISCRIVE per intero dentro
# /etc/mkinitcpio.conf partendo dal tipo di partizionamento scelto, e aggiunge
# `plymouth` da solo quando il pacchetto è presente nel sistema di
# destinazione (prima di `encrypt`, così la richiesta della password del disco
# passa dalla schermata di avvio). `encrypt`/`lvm2` arrivano quando il layout
# li richiede.
---
useSystemdHook: false

source: "/etc/mkinitcpio.conf"

hooks:
    prepend: []
    append: []
    remove: []
