# /etc/calamares/modules/welcome.conf — NicoOS 27 Extreme
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: ""

requirements:
    requiredStorage: 10.0
    requiredRam: 2.0
    internetCheckUrl: "https://archlinux.org"
    check:
        - storage
        - ram
        - root
        - screen
    required:
        - storage
        - ram

geoip:
    style: "none"
    url: "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
