# /etc/calamares/modules/users.conf — NicoOS 27 Extreme
#
# L'account predefinito di NicoOS è `nicoos`, con zsh come shell di login e
# sudo tramite il gruppo `wheel` (vedi /etc/sudoers). Non è configurato alcun
# accesso automatico: l'autologin del desktop esiste solo sulla ISO live.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - audio
    - input
    - network
    - storage
    - power
    - rfkill
    - optical
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: false

autologinGroup: autologin
doAutologin: false
displayAutologin: false

setRootPassword: true
doReusePassword: false

# Politica delle password voluta da NicoOS: nessun requisito di "forza", solo
# una lunghezza minima di 6 caratteri, così è accettabile anche un PIN
# numerico come 325476.
#
# Il controllo libpwquality va tenuto fuori di proposito: Calamares lo
# considera superato solo con un punteggio >= 40 (arbitrary_minimum_strength in
# CheckPWQuality.cpp) e con minclass=1 qualsiasi password semplice resta sotto
# quella soglia, quindi verrebbe respinta. Con allowWeakPasswords a false un
# controllo fallito è un errore bloccante, per cui l'unica regola applicata è
# minLength — che è esattamente quella che vogliamo.
passwordRequirements:
    minLength: 6
allowWeakPasswords: false

user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, nicoos-live, sddm, calamares ]
    home_permissions: "o700"
    nopasswd_group: "nopasswdlogin"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "nicoos-${cpu}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    loginName:
        value: "nicoos"
        editable: true
    fullName:
        value: "Utente NicoOS"
        editable: true
