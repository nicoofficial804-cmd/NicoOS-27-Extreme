# /etc/calamares/modules/locale.conf — NicoOS 27 Extreme
---
# NicoOS è distribuita solo in italiano: /etc/locale.gen contiene
# esclusivamente it_IT.UTF-8 e /etc/locale.conf imposta LANG=it_IT.UTF-8,
# quindi il modulo propone l'italiano come lingua già selezionata.
localeGenPath: /etc/locale.gen

geoip:
    style: "none"
    url: "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
