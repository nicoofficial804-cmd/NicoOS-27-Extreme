# /etc/calamares/modules/unpackfs.conf — NicoOS 27 Extreme
#
# Il root file system della ISO live viene scompattato sulla destinazione.
# Quel file system contiene Hyprland, SDDM, la shell NicoOS (compilata e
# installata da nicoos27-shell), la configurazione di Calamares, la Shell di
# emergenza e ogni dipendenza: esattamente ciò che deve avere il sistema
# installato.
#
# Non viene escluso nulla di ciò che serve al sistema installato. Sono
# esclusi lo stato di esecuzione del supporto live (mount, log, cache, home
# dell'utente live) e i file di configurazione validi solo per il live che
# anche nicoos-target-prepare rimuove.
---
unpack:
  -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
      weight: 100
      exclude:
        # file system del kernel/pseudo: non copiare mai lo stato live
        - "dev/*"
        - "proc/*"
        - "sys/*"
        - "run/*"
        - "tmp/*"
        # cache, log e stato della sessione
        - "var/cache/pacman/pkg/*"
        - "var/log/journal/*"
        - "var/tmp/*"
        # la home dell'utente live: Calamares crea l'account reale
        - "home/*"
        - "root/*"
        # configurazione valida solo nel live (rimossa anche da
        # nicoos-target-prepare)
        - "etc/mkinitcpio.conf.d/archiso.conf"
        - "etc/sddm.conf.d/20-nicoos-live-autologin.conf"
        - "etc/sudoers.d/10-nicoos-live"
        # l'immagine ISO stessa non fa parte del sistema installato
        - "usr/share/nicoos/airootfs.sfs"
        - "etc/calamares/branding/nicoos/slideshow/*"
