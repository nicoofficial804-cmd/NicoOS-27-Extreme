# /etc/calamares/modules/bootloader.conf — NicoOS 27 Extreme
#
# GRUB è usato su entrambi i tipi di firmware: è l'unico bootloader
# altrettanto affidabile su UEFI e su macchine BIOS legacy, e dà al sistema
# installato un menu con il kernel NicoOS e memtest.
---
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
    - "timeout 5"
    - "console-mode keep"

# Nessun parametro archiso qui: il kernel installato deve montare il vero
# root file system dal disco, non cercare un squashfs sul supporto di
# installazione.
kernelParams:
    - "quiet"
    - "loglevel=3"
    - "nowatchdog"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
installHybridGRUB: false
