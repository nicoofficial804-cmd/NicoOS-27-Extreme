# /etc/calamares/modules/nicoos-target-finalize.conf
#
# istanza shellprocess `target-finalize`: viene eseguita dentro il sistema di
# destinazione dopo che initramfs e bootloader sono a posto, e fa fallire
# l'installazione se il sistema finito non sarebbe in grado di avviarsi nel
# desktop NicoOS.
---
dontChroot: false
timeout: 300
verbose: true
script:
    - command: "/usr/local/bin/nicoos-target-finalize"
      timeout: 300
