# /etc/calamares/modules/packages.conf — NicoOS 27 Extreme
#
# Il sistema installato ottiene il software dal root file system live
# scompattato, quindi questo modulo non installa nulla. Rimuove solo i
# pacchetti che hanno senso unicamente sul supporto di installazione, usando
# `try_remove` così un pacchetto mancante o già rimosso non può mai far
# fallire un'installazione.
#
# Il backend pacman esegue `pacman -Rs`, che porta via anche le dipendenze
# rimaste senza altri utilizzatori: elencando calamares si eliminano quindi
# anche kpmcore, libpwquality, yaml-cpp e le librerie Python che servivano
# solo a lui. `nicoos-target-prepare` marca esplicitamente come installati i
# programmi che invece devono restare (foot, smartmontools), così la
# ricorsione di `-Rs` non può portarli via.
#
# Non serve alcuna connessione a Internet e nessuna viene tentata
# (update_db: false).
---
backend: pacman

skip_if_no_internet: false
update_db: false
ignore_update_db_error: true
update_system: false

pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: true

operations:
  - try_remove:
      # Solo supporto live / solo installazione:
      - memtest86+
      - memtest86+-efi
      - mkinitcpio-archiso
      # L'installer non serve al sistema installato: Calamares stesso, il
      # motore di partizionamento e le dipendenze usate solo da loro.
      - calamares
      - kpmcore
      - libpwquality
      - yaml-cpp
      - python-yaml
      - python-jsonschema
