# /etc/calamares/settings.conf — NicoOS 27 Extreme
#
# Strategia di installazione
# --------------------------
# NicoOS non scarica pacchetti al momento dell'installazione. La ISO live
# contiene già il root file system *completo* di NicoOS (vedi
# ../packages.x86_64) e l'installer lo scompatta sul disco di destinazione
# (`unpackfs`). Il sistema che si avvia dopo è quindi, bit per bit, lo stesso
# ambiente Hyprland + SDDM + shell NicoOS provato dal vivo, senza bisogno di
# accesso alla rete e senza possibilità di un desktop installato a metà.
#
# `shellprocess@target-prepare` rimuove poi ciò che ha senso solo su un
# supporto live (hook archiso dell'initramfs, utente live, autologin, sudo
# senza password), e `shellprocess@target-finalize` verifica il sistema
# finito.
---
modules-search: [ local ]

instances:
  - id: target-prepare
    module: shellprocess
    config: nicoos-target-prepare.conf
  - id: target-finalize
    module: shellprocess
    config: nicoos-target-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      # --- layout del disco ------------------------------------------------
      - partition
      - mount

      # --- il root file system di NicoOS, direttamente dalla ISO ------------
      - unpackfs

      # --- elimina lo stato del supporto live, tieni un sistema pulito -------
      - shellprocess@target-prepare

      # --- identità del sistema ---------------------------------------------
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab

      # --- initramfs del sistema installato ---------------------------------
      - initcpiocfg
      - initcpio

      # --- utenti e servizi -------------------------------------------------
      - users
      - displaymanager
      - hwclock
      - services-systemd

      # --- bootloader -------------------------------------------------------
      - grubcfg
      - bootloader

      # --- verifica, poi rimuovi i pacchetti solo-live ----------------------
      - shellprocess@target-finalize
      - packages

      - umount

  - show:
      - finished

branding: nicoos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
