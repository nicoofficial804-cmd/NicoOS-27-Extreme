# SOLO ISO LIVE. Calamares elimina questo file dal sistema installato
# (nicoos-target-prepare), così un'installazione nuova chiede sempre la password.
#
# Sulla live l'accesso automatico è permanente: Relogin=true fa ripartire la
# sessione ogni volta che termina, anche dopo un logout o dopo un crash di
# Hyprland. È il comportamento atteso da un supporto di installazione: il
# desktop c'è sempre, senza chiedere credenziali che sulla live sono note
# (utente `nicoos`, password `nicoos`).
#
# Un guasto di Hyprland non diventa un ciclo cieco: nicoos-session chiede la
# Shell di emergenza su una VT (nicoos-emergency-console.path) e resta viva
# finché quella console è aperta, quindi SDDM non riavvia nulla mentre si sta
# lavorando nella shell; quando la console viene chiusa la sessione termina e
# l'autologin riparte.
[Autologin]
User=nicoos
Session=nicoos
Relogin=true
