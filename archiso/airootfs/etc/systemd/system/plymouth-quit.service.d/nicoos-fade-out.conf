# NicoOS 27 Extreme — la schermata di avvio si spegne in dissolvenza.
#
# Plymouth chiude la splash nello stesso istante in cui riceve `quit`: il tema
# non avrebbe il tempo di animare l'uscita (misurato: da un fotogramma a piena
# opacità a quello successivo già nero). Questo drop-in manda prima al tema il
# segnale `__nicoos_fade__` su `--status` e aspetta la fine dell'animazione; la
# chiusura vera parte subito dopo.
#
# L'attesa la calcola nicoos-plymouth-fade-out: 12 s di video (120 fotogrammi ×
# 0,1 s), più la dissolvenza, meno il tempo in cui la splash è già stata a
# schermo. Se la splash non è attiva (nessun `splash` sulla riga di comando) lo
# script non fa nulla e non fa perdere tempo.
[Service]
ExecStartPre=-/usr/local/bin/nicoos-plymouth-fade-out
