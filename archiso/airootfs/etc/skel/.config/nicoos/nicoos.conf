# ~/.config/nicoos/nicoos.conf — shell di NicoOS 27 Extreme
# Modificabile a caldo: la shell controlla questo file e applica subito le
# modifiche.

[appearance]
# Colore d'accento di NicoOS (rosso del logo ufficiale)
accent_color=#e3272b
panel_opacity=0.72
ui_scale=1.0
icon_theme=Papirus-Dark
font_family=JetBrainsMono Nerd Font

[panel]
position=top
height=34

[behavior]
animation_speed_ms=180
clock_format=HH:mm
launcher_shortcut=SUPER,R
workspace_wrap_around=true
# Aree di lavoro sempre presenti (1..N). Sono aree reali di Hyprland: quelle
# vuote vengono create al primo uso.
workspace_count=10

[lock]
software_render=auto
