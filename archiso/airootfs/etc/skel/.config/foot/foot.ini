# ~/.config/foot/foot.ini — terminale di NicoOS 27 Extreme
#
# Scritto per la sintassi di configurazione di foot 1.28 (foot.ini(5) di
# quella versione):
#   * la sezione [colors] non esiste più — gli schemi di colore stanno in
#     [colors-dark] (usata per impostazione predefinita) e [colors-light];
#   * lo stile in [cursor] è uno tra block, beam, underline o hollow, quindi
#     un nome di *tema* del cursore come "Adwaita" non è valido lì. Il tema
#     Xcursor è impostato dal compositore (XCURSOR_THEME, esportato da
#     hyprland.lua), non da foot.

font=JetBrainsMono Nerd Font:size=11

[colors-dark]
alpha=0.94
background=0b1220
foreground=e6f5ff

regular0=0a0f18
regular1=ff5c7a
regular2=3ee08f
regular3=f5d67b
regular4=00d9ff
regular5=7a5cff
regular6=5ce1e6
regular7=b8c7d9

bright0=2a3546
bright1=ff7f97
bright2=6bf0ad
bright3=ffe9a8
bright4=66e9ff
bright5=a48cff
bright6=8bf0f5
bright7=ffffff

[cursor]
style=block

[csd]
preferred=client
