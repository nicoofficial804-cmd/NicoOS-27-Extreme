# ~/.config/hypr/hypridle.conf — NicoOS 27 Extreme idle policy
general {
    lock_cmd = pidof hyprlock >/dev/null 2>&1 || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the panel a bit after 4 minutes of inactivity.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 25% 2>/dev/null || true
    on-resume  = brightnessctl -r 2>/dev/null || true
}

# Lock after 10 minutes.
listener {
    timeout = 600
    on-timeout = pidof hyprlock >/dev/null 2>&1 || hyprlock
}

# Screen off after 15 minutes.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
