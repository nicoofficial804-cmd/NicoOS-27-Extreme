# /etc/mkinitcpio.conf.d/archiso.conf
#
# SOLO ISO LIVE. Questo drop-in aggiunge gli hook archiso sopra il file
# mkinitcpio.conf originale, cosi' il supporto live puo' trovare e montare
# il proprio squashfs.
#
# Viene ELIMINATO dal sistema di destinazione tramite Calamares
# (/usr/local/bin/nicoos-target-prepare), cosi' un NicoOS installato avvia
# un initramfs del tutto normale e autosufficiente.
# Solo gli hook che il supporto live usa davvero: la ISO viene avviata da un
# supporto locale, quindi gli hook PXE (che richiederebbero anche ipconfig di
# dhcpcd, nbd-client e mkinitcpio-nfs-utils) sono lasciati fuori di proposito.
#
# `plymouth` porta la schermata di avvio di NicoOS già dall'initramfs (tema
# nicoos, selezionato in /etc/plymouth/plymouthd.conf da customize_airootfs.sh:
# quel file appartiene al pacchetto plymouth e non può stare nell'overlay). Su
# un sistema installato questo file non esiste: lì Calamares rigenera
# /etc/mkinitcpio.conf con lo stesso hook.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
