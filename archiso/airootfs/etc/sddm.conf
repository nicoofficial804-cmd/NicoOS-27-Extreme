# /etc/sddm.conf — NicoOS 27 Extreme
#
# Il sistema installato NON usa l'accesso automatico: l'utente digita la
# propria password nel greeter SDDM di NicoOS. (La ISO live aggiunge il file
# separato /etc/sddm.conf.d/20-nicoos-live-autologin.conf, che Calamares
# rimuove dal sistema di destinazione.)

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on

[Theme]
Current=nicoos
ThemeDir=/usr/share/sddm/themes
# Lo stesso tema del cursore della sessione Hyprland e della shell. Impostarlo
# serve perché il greeter gira su Xorg: senza un tema Xcursor esplicito Xorg
# usa il proprio cursore predefinito (una "X" nera) al posto della freccia.
CursorTheme=Adwaita
CursorSize=24

[Users]
DefaultSession=nicoos
HideShells=/sbin/nologin,/usr/bin/nologin,/bin/false
MaximumUid=60513
MinimumUid=1000
