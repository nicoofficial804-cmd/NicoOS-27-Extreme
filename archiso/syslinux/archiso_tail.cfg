LABEL existing
TEXT HELP
Avvia un sistema operativo già presente.
Premi TAB per modificare il numero di disco e partizione da avviare.
ENDTEXT
MENU LABEL Avvia sistema operativo esistente
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Esegui Memtest86+ (test della RAM)
LINUX /boot/memtest86+/memtest

