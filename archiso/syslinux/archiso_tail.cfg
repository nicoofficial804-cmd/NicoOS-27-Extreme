TEXT HELP
Riavvia il computer.
ENDTEXT
MENU LABEL Riavvia
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Spegni il computer.
ENDTEXT
MENU LABEL Spegni
COM32 poweroff.c32
