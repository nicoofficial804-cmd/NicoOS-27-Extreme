LABEL nicoos
TEXT HELP
Avvia NicoOS 27 Extreme (desktop live e installer).
Hyprland + la shell NicoOS + Calamares, su BIOS.
ENDTEXT
MENU LABEL ^NicoOS 27 Extreme — desktop live e installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL nicoosverbose
TEXT HELP
Avvia NicoOS 27 Extreme con messaggi dettagliati del kernel e di systemd.
Usalo se la sessione grafica non parte.
ENDTEXT
MENU LABEL NicoOS 27 Extreme — avvio ^dettagliato (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.show_status=1 loglevel=7
