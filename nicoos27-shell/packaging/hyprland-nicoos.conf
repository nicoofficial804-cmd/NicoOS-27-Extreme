# ~/.config/hypr/conf.d/nicoos-shell.conf
#
# Includi da hyprland.conf con:
#   source = ~/.config/hypr/conf.d/nicoos-shell.conf
#
# La shell non cattura scorciatoie globali (andrebbe contro la gestione
# dell'input di Hyprland). Ascolta su
# $XDG_RUNTIME_DIR/nicoos/shell-control.sock e questi bind le inviano comandi
# di una riga tramite `socat`.

exec-once = nicoos-shell

# --- Popup ------------------------------------------------------------
bind = SUPER, R,   exec, echo "launcher.toggle"      | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, N,   exec, echo "controlcenter.toggle" | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, TAB, exec, echo "workspaces.toggle"    | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, X,   exec, echo "power.toggle"         | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, W,   exec, echo "wallpapers.toggle"    | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, V,   exec, echo "clipboard.toggle"     | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, C,   exec, echo "calendar.toggle"      | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock

# --- Azioni rapide ----------------------------------------------------
bind = ,          Print, exec, echo "screenshot.region" | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SHIFT,     Print, exec, echo "screenshot.full"   | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER SHIFT, R,   exec, echo "record.toggle"      | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER SHIFT, N,   exec, echo "dnd.toggle"         | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER, L,         exec, echo "lock"             | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock
bind = SUPER SHIFT, W,   exec, echo "wallpaper.random"   | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/nicoos/shell-control.sock

# Altri comandi compresi dal socket: nightlight.toggle, caffeine.toggle,
# profile.cycle, suspend.
